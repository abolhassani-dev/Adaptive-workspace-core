name = "ehsan-shop-bot"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Secrets are NOT set here — they would end up in git. Set them once with:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
# See README.md.

[[d1_databases]]
binding = "DB"
database_name = "ehsan-shop-bot"
# Not a secret — it only identifies which D1 database this Worker binds to.
database_id = "e826ef7f-47b0-4ff5-aa04-662fe1e41066"
migrations_dir = "migrations"

[observability]
enabled = true
